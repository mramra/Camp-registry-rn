name: Publish OTA update (preview)

# يشتغل فقط عند push لـ main، وبس لو التغيير مسّ ملفات فعلية بالكود
# (JS/JSX/JSON/assets) -- مش لو كان التغيير مجرد README أو ملاحظات،
# عشان نقلل استهلاك دقائق CI/CD المجانية قد الإمكان.
on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'

jobs:
  publish_preview_update:
    name: Publish preview update
    type: update
    # ── مهم جداً: هذا السطر هو سبب العطل السابق ──
    # بدون تحديده صراحة، يفترض EAS الافتراضي "production"
    # وتختفي التحديثات عن أجهزة preview بصمت بدون أي خطأ ظاهر.
    # ملاحظة: لازم يكون بنفس مستوى "type" -- مش جوا "params" (كان هذا
    # سبب فشل التشغيل الأول بعد 18 ثانية فقط، خطأ صياغة/تحقق).
    environment: preview
    params:
      branch: preview
      message: 'تحديث تلقائي (OTA) بعد push على main'
